<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Listings | Campus Marketplace Admin</title>
  <meta name="description" content="Review and moderate all campus marketplace listings.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <span class="admin-sidebar-badge">Campus Admin</span>
        <div class="admin-sidebar-brand">
          <span style="font-size: 1.4rem;">🛡️</span>
          <h2>Management</h2>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="/admin.html" class="admin-nav-item">
          <span class="admin-nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="/admin-users.html" class="admin-nav-item">
          <span class="admin-nav-icon">👥</span>
          <span>Users</span>
        </a>
        <a href="/admin-products.html" class="admin-nav-item active">
          <span class="admin-nav-icon">📦</span>
          <span>Products</span>
        </a>
        <a href="/admin-reports.html" class="admin-nav-item">
          <span class="admin-nav-icon">🚩</span>
          <span>Reports</span>
        </a>
        <a href="/admin-categories.html" class="admin-nav-item">
          <span class="admin-nav-icon">🏷️</span>
          <span>Categories</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="/marketplace.html" class="admin-sidebar-link">
          <span>&larr;</span> Back to Marketplace
        </a>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <div class="admin-header-title">
          <h1>Marketplace Listings</h1>
          <p>Inspect, filter, or moderate student items currently listed across campus.</p>
        </div>
        <div class="admin-header-actions">
          <span id="product-count-badge" class="badge badge-admin" style="font-size: 0.85rem; padding: 0.45rem 0.85rem;">0 Total Listings</span>
        </div>
      </div>

      <!-- Search & Filter Toolbar -->
      <div class="admin-toolbar">
        <div class="admin-search-box">
          <span class="admin-search-icon">🔍</span>
          <input type="text" id="products-search-input" class="admin-search-input" placeholder="Search by item title or seller..." />
        </div>
        <div class="admin-filter-group">
          <select id="product-status-filter" class="form-select" style="min-width: 150px; font-size: 0.9rem; padding: 0.45rem 0.75rem;">
            <option value="">All Statuses</option>
            <option value="AVAILABLE">Available</option>
            <option value="SOLD">Sold</option>
            <option value="REMOVED">Removed</option>
          </select>
        </div>
      </div>

      <div class="admin-table-card">
        <div id="admin-products-container">
          <div class="spinner-wrapper" style="padding: 3rem 1rem;">
            <div class="spinner"></div>
            <span class="spinner-text">Loading marketplace listings...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/admin-products.js"></script>
</body>
</html>
