<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account | Campus Marketplace</title>
  <meta name="description" content="Register for a free Campus Marketplace student account to buy and sell textbooks and gear.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎒</div>
        <h1>Create Student Account</h1>
        <p>Join fellow students buying and selling on campus</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Jordan Miller" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Campus / Student Email</label>
          <input type="email" id="email" class="form-control" placeholder="jordan@campus.edu" required autocomplete="email" />
          <div class="form-hint">Used for login and direct inquiries</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="+1 (555) 000-0000" required autocomplete="tel" />
          <div class="form-hint">For easy campus meetup coordination</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Show password" aria-controls="password" aria-pressed="false">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6" autocomplete="new-password" />
            <button type="button" class="password-toggle-btn" id="toggle-confirm-password" aria-label="Show confirm password" aria-controls="confirmPassword" aria-pressed="false">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary btn-block btn-lg mt-4">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Log in here</a>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const eyeIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      const eyeOffIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

      // Accessible password visibility toggle handlers
      function setupPasswordToggle(btnId, inputId, fieldName) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        if (btn && input) {
          btn.addEventListener('click', () => {
            const isCurrentlyPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isCurrentlyPassword ? 'text' : 'password');
            btn.setAttribute('aria-label', isCurrentlyPassword ? `Hide ${fieldName}` : `Show ${fieldName}`);
            btn.setAttribute('aria-pressed', isCurrentlyPassword ? 'true' : 'false');
            btn.innerHTML = isCurrentlyPassword ? eyeOffIconSvg : eyeIconSvg;
          });
        }
      }

      setupPasswordToggle('toggle-password', 'password', 'password');
      setupPasswordToggle('toggle-confirm-password', 'confirmPassword', 'confirm password');

      const form = document.getElementById('register-form');
      const submitBtn = document.getElementById('register-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!name || !email || !phone || !password) {
          window.Utils.showToast('Please fill out all required fields', 'warning');
          return;
        }

        if (password.length < 6) {
          window.Utils.showToast('Password must be at least 6 characters long', 'warning');
          return;
        }

        if (password !== confirmPassword) {
          window.Utils.showToast('Passwords do not match', 'warning');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account...';

          const response = await window.API.registerUser({
            name,
            email,
            phone,
            password,
            confirmPassword,
          });

          if (response.success) {
            window.Utils.showToast('Account registered successfully! Welcome to Campus Marketplace.', 'success');
            setTimeout(() => {
              window.location.href = '/dashboard.html';
            }, 800);
          }
        } catch (error) {
          window.Utils.showToast(error.message || 'Registration failed', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
