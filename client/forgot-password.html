<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Campus Marketplace</title>
  <meta name="description" content="Reset your Campus Marketplace student account password quickly and securely.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border-subtle, #e2e8f0);
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted, #64748b);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .auth-tab-btn.active {
      color: var(--primary, #4f46e5);
      border-bottom-color: var(--primary, #4f46e5);
    }
    .reset-result-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border-radius: var(--radius-md, 8px);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-size: 0.92rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.8rem; margin-bottom: 0.5rem;">🔑</div>
        <h1>Forgot Password</h1>
        <p>Choose your preferred way to recover your student account</p>
      </div>

      <!-- Recovery Method Tabs -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab-btn active" id="tab-email-btn" role="tab" aria-selected="true" aria-controls="panel-email">
          Email Reset Link
        </button>
        <button type="button" class="auth-tab-btn" id="tab-phone-btn" role="tab" aria-selected="false" aria-controls="panel-phone">
          Verify via Phone
        </button>
      </div>

      <!-- Tab 1: Email Reset Link -->
      <div id="panel-email" role="tabpanel">
        <form id="forgot-form">
          <div class="form-group">
            <label class="form-label" for="email">Registered Campus Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="name@campus.edu"
              required
              autocomplete="email"
            />
            <div class="form-hint" style="margin-top: 0.4rem; font-size: 0.8rem; color: var(--text-muted);">
              We will generate a secure reset link valid for 15 minutes.
            </div>
          </div>

          <button type="submit" id="forgot-btn" class="btn btn-primary btn-block btn-lg mt-4">
            Send Reset Instructions
          </button>
        </form>

        <div id="email-result-container" style="display: none;"></div>
      </div>

      <!-- Tab 2: Quick Reset via Registered Phone -->
      <div id="panel-phone" role="tabpanel" style="display: none;">
        <form id="phone-reset-form">
          <div class="form-group">
            <label class="form-label" for="phone-email">Campus Email</label>
            <input
              type="email"
              id="phone-email"
              class="form-control"
              placeholder="name@campus.edu"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="phone-number">Registered Phone Number</label>
            <input
              type="tel"
              id="phone-number"
              class="form-control"
              placeholder="e.g. 9876543210"
              required
              autocomplete="tel"
            />
            <div class="form-hint" style="margin-top: 0.4rem; font-size: 0.8rem; color: var(--text-muted);">
              Must match the mobile number used when creating your account.
            </div>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
              <label class="form-label" for="phone-new-password" style="margin-bottom: 0;">New Password</label>
            </div>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="phone-new-password"
                class="form-control"
                placeholder="At least 6 characters"
                minlength="6"
                required
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle-btn"
                id="toggle-phone-password"
                aria-label="Show new password"
                aria-controls="phone-new-password"
                aria-pressed="false"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
              <label class="form-label" for="phone-confirm-password" style="margin-bottom: 0;">Confirm New Password</label>
            </div>
            <div class="password-input-wrapper">
              <input
                type="password"
                id="phone-confirm-password"
                class="form-control"
                placeholder="Re-enter your new password"
                minlength="6"
                required
                autocomplete="new-password"
              />
              <button
                type="button"
                class="password-toggle-btn"
                id="toggle-phone-confirm-password"
                aria-label="Show confirm password"
                aria-controls="phone-confirm-password"
                aria-pressed="false"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="phone-reset-btn" class="btn btn-primary btn-block btn-lg mt-4">
            Reset Password
          </button>
        </form>
      </div>

      <div class="auth-footer">
        Remembered your password? <a href="/login">Log in here</a>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // SVG icons for accessible eye toggle
      const eyeIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      const eyeOffIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

      function setupPasswordToggle(btnId, inputId, fieldName) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        if (btn && input) {
          btn.addEventListener('click', () => {
            const isCurrentlyPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isCurrentlyPassword ? 'text' : 'password');
            btn.setAttribute('aria-label', isCurrentlyPassword ? `Hide ${fieldName}` : `Show ${fieldName}`);
            btn.setAttribute('aria-pressed', isCurrentlyPassword ? 'true' : 'false');
            btn.innerHTML = isCurrentlyPassword ? eyeOffIconSvg : eyeIconSvg;
          });
        }
      }

      setupPasswordToggle('toggle-phone-password', 'phone-new-password', 'new password');
      setupPasswordToggle('toggle-phone-confirm-password', 'phone-confirm-password', 'confirm password');

      // Tab Switcher
      const tabEmailBtn = document.getElementById('tab-email-btn');
      const tabPhoneBtn = document.getElementById('tab-phone-btn');
      const panelEmail = document.getElementById('panel-email');
      const panelPhone = document.getElementById('panel-phone');

      tabEmailBtn.addEventListener('click', () => {
        tabEmailBtn.classList.add('active');
        tabEmailBtn.setAttribute('aria-selected', 'true');
        tabPhoneBtn.classList.remove('active');
        tabPhoneBtn.setAttribute('aria-selected', 'false');
        panelEmail.style.display = 'block';
        panelPhone.style.display = 'none';
      });

      tabPhoneBtn.addEventListener('click', () => {
        tabPhoneBtn.classList.add('active');
        tabPhoneBtn.setAttribute('aria-selected', 'true');
        tabEmailBtn.classList.remove('active');
        tabEmailBtn.setAttribute('aria-selected', 'false');
        panelPhone.style.display = 'block';
        panelEmail.style.display = 'none';
      });

      // 1. Email Reset Request Form
      const forgotForm = document.getElementById('forgot-form');
      const forgotBtn = document.getElementById('forgot-btn');
      const resultBox = document.getElementById('email-result-container');

      forgotForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();

        if (!email) {
          window.Utils.showToast('Please enter your campus email address', 'warning');
          return;
        }

        try {
          forgotBtn.disabled = true;
          forgotBtn.textContent = 'Generating reset link...';

          const res = await window.API.forgotPassword({ email });

          if (res.success) {
            window.Utils.showToast('Reset instructions generated!', 'success');

            const data = res.data || {};
            const resetUrl = data.resetUrl || (data.resetToken ? `/reset-password?token=${data.resetToken}` : null);

            resultBox.style.display = 'block';
            resultBox.className = 'reset-result-box';
            resultBox.innerHTML = `
              <div style="font-weight: 700; font-size: 1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem;">
                <span>✓</span> Reset Link Ready
              </div>
              <p style="margin-bottom: 0.75rem;">
                If <strong>${window.Utils.escapeHTML(email)}</strong> is registered, password recovery instructions are active for 15 minutes.
              </p>
              ${
                resetUrl
                  ? `
                    <div style="background: #ffffff; padding: 0.85rem; border-radius: 6px; border: 1px solid #86efac; margin-top: 0.75rem;">
                      <div style="font-size: 0.8rem; font-weight: 600; color: #15803d; text-transform: uppercase; margin-bottom: 0.3rem;">
                        ${data.demoNotice ? 'Campus Direct Access' : 'Password Reset Action'}
                      </div>
                      <a href="${resetUrl}" class="btn btn-primary btn-block" style="text-decoration: none; margin-top: 0.4rem;">
                        Click Here to Set New Password &rarr;
                      </a>
                    </div>
                  `
                  : ''
              }
            `;
          }
        } catch (err) {
          window.Utils.showToast(err.message || 'Unable to request password reset', 'error');
        } finally {
          forgotBtn.disabled = false;
          forgotBtn.textContent = 'Send Reset Instructions';
        }
      });

      // 2. Quick Phone Reset Form
      const phoneForm = document.getElementById('phone-reset-form');
      const phoneBtn = document.getElementById('phone-reset-btn');

      phoneForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('phone-email').value.trim();
        const phone = document.getElementById('phone-number').value.trim();
        const password = document.getElementById('phone-new-password').value;
        const confirmPassword = document.getElementById('phone-confirm-password').value;

        if (!email || !phone || !password) {
          window.Utils.showToast('Please fill out all required fields', 'warning');
          return;
        }

        if (password.length < 6) {
          window.Utils.showToast('Password must be at least 6 characters long', 'warning');
          return;
        }

        if (password !== confirmPassword) {
          window.Utils.showToast('Passwords do not match', 'warning');
          return;
        }

        try {
          phoneBtn.disabled = true;
          phoneBtn.textContent = 'Verifying & resetting...';

          const res = await window.API.resetPasswordByPhone({
            email,
            phone,
            password,
            confirmPassword,
          });

          if (res.success) {
            window.Utils.showToast('Password reset successfully! Redirecting to login...', 'success');
            setTimeout(() => {
              window.location.href = '/login';
            }, 1200);
          }
        } catch (err) {
          window.Utils.showToast(err.message || 'Verification failed', 'error');
        } finally {
          phoneBtn.disabled = false;
          phoneBtn.textContent = 'Reset Password';
        }
      });
    });
  </script>
</body>
</html>
