<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | CampusCart</title>
  <meta name="description" content="Set a secure new password for your Campus Marketplace student account.">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.8rem; margin-bottom: 0.5rem;">🔒</div>
        <h1>Set New Password</h1>
        <p>Enter your new password to regain access to your account</p>
      </div>

      <div id="token-status-badge" style="display: none; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 0.6rem 0.85rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem; align-items: center; gap: 0.5rem;">
        <span>🛡️</span> <span>Reset security token recognized</span>
      </div>

      <form id="reset-password-form">
        <!-- Token Input (shown only if not present in URL query) -->
        <div class="form-group" id="token-field-group">
          <label class="form-label" for="reset-token">Reset Token / Code</label>
          <input
            type="text"
            id="reset-token"
            class="form-control"
            placeholder="Paste your 64-character reset token"
            required
            autocomplete="off"
          />
          <div class="form-hint" style="margin-top: 0.4rem; font-size: 0.8rem; color: var(--text-muted);">
            Obtained from your reset link or forgot password screen.
          </div>
        </div>

        <!-- New Password Field -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" for="new-password" style="margin-bottom: 0;">New Password</label>
          </div>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="new-password"
              class="form-control"
              placeholder="At least 6 characters"
              minlength="6"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle-btn"
              id="toggle-new-password"
              aria-label="Show new password"
              aria-controls="new-password"
              aria-pressed="false"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <!-- Confirm New Password Field -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" for="confirm-password" style="margin-bottom: 0;">Confirm New Password</label>
          </div>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="confirm-password"
              class="form-control"
              placeholder="Re-enter your new password"
              minlength="6"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle-btn"
              id="toggle-confirm-password"
              aria-label="Show confirm password"
              aria-controls="confirm-password"
              aria-pressed="false"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-block btn-lg mt-4">
          Save New Password
        </button>
      </form>

      <div class="auth-footer">
        Back to <a href="/login">Log In</a> &bull; <a href="/forgot-password">Request New Link</a>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // SVG icons for password visibility
      const eyeIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      const eyeOffIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

      function setupPasswordToggle(btnId, inputId, fieldName) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        if (btn && input) {
          btn.addEventListener('click', () => {
            const isCurrentlyPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isCurrentlyPassword ? 'text' : 'password');
            btn.setAttribute('aria-label', isCurrentlyPassword ? `Hide ${fieldName}` : `Show ${fieldName}`);
            btn.setAttribute('aria-pressed', isCurrentlyPassword ? 'true' : 'false');
            btn.innerHTML = isCurrentlyPassword ? eyeOffIconSvg : eyeIconSvg;
          });
        }
      }

      setupPasswordToggle('toggle-new-password', 'new-password', 'new password');
      setupPasswordToggle('toggle-confirm-password', 'confirm-password', 'confirm password');

      // Check query parameter for ?token=...
      const urlParams = new URLSearchParams(window.location.search);
      const urlToken = urlParams.get('token');

      const tokenInput = document.getElementById('reset-token');
      const tokenGroup = document.getElementById('token-field-group');
      const badge = document.getElementById('token-status-badge');

      if (urlToken) {
        tokenInput.value = urlToken.trim();
        tokenGroup.style.display = 'none'; // Hide token input since it was auto-detected from link
        badge.style.display = 'flex';
      }

      const form = document.getElementById('reset-password-form');
      const submitBtn = document.getElementById('reset-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const token = tokenInput.value.trim();
        const password = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (!token) {
          window.Utils.showToast('Please provide your reset token', 'warning');
          return;
        }

        if (password.length < 6) {
          window.Utils.showToast('Password must be at least 6 characters long', 'warning');
          return;
        }

        if (password !== confirmPassword) {
          window.Utils.showToast('Passwords do not match', 'warning');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Updating password...';

          const res = await window.API.resetPassword({
            token,
            password,
            confirmPassword,
          });

          if (res.success) {
            window.Utils.showToast('Password reset successfully! Redirecting to login...', 'success');
            setTimeout(() => {
              window.location.href = '/login';
            }, 1200);
          }
        } catch (err) {
          window.Utils.showToast(err.message || 'Password reset failed', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save New Password';
        }
      });
    });
  </script>
</body>
</html>
