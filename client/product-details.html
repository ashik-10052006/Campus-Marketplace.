<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Campus Marketplace</title>
  <meta name="description" content="View detailed product information, condition, and contact the student seller directly.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/products.css">
</head>
<body class="product-details-page">
  <header class="navbar" id="navbar"></header>

  <main class="container" style="min-height: calc(100vh - 180px); padding-top: 2rem;">
    <!-- Breadcrumb -->
    <div style="margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      <a href="/index.html">Home</a> &gt; <a href="/products.html">Marketplace</a> &gt; <span id="breadcrumb-product-name" style="color: var(--text-main);">Item Details</span>
    </div>

    <!-- Product Details Content Container -->
    <div id="product-details-container">
      <div class="spinner-wrapper">
        <div class="spinner"></div>
        <span class="spinner-text">Loading item details...</span>
      </div>
    </div>
  </main>

  <!-- Report Modal -->
  <div class="modal" id="report-modal">
    <div class="modal-backdrop" id="report-modal-backdrop" onclick="window.Utils && window.Utils.closeModal('report-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">🚩 Report Listing Violation</h3>
        <button type="button" class="modal-close" id="close-report-modal-btn" aria-label="Close modal" onclick="window.Utils && window.Utils.closeModal('report-modal')">&times;</button>
      </div>
      <form id="report-form">
        <div class="modal-body">
          <p class="text-muted" style="font-size: 0.9rem; margin-bottom: 1.25rem;">
            Help keep our campus marketplace safe, authentic, and respectful.
          </p>

          <div class="form-group">
            <label class="form-label" for="report-reason">Reason for Report</label>
            <select id="report-reason" class="form-select" required>
              <option value="">Select a violation category...</option>
              <option value="Spam">Spam</option>
              <option value="Scam">Scam</option>
              <option value="Inappropriate Content">Inappropriate Content</option>
              <option value="Wrong Information">Wrong Information</option>
              <option value="Duplicate Listing">Duplicate Listing</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="report-description">Additional Details (Optional)</label>
            <textarea id="report-description" class="form-textarea" placeholder="Explain what makes this listing suspicious or inaccurate..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancel-report-btn" onclick="window.Utils && window.Utils.closeModal('report-modal')">Cancel</button>
          <button type="submit" id="submit-report-btn" class="btn btn-danger">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container text-center">
      <p>&copy; 2026 Campus Marketplace for Students. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/product-details.js"></script>
</body>
</html>
