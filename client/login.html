<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Campus Marketplace</title>
  <meta name="description" content="Log in to your Campus Marketplace account to buy, sell, and message campus peers.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎓</div>
        <h1>Welcome Back</h1>
        <p>Log in with your student credentials to continue</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Campus Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@campus.edu" required autocomplete="email" />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          </div>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg mt-4">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Sign up for free</a>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        });
      }

      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          window.Utils.showToast('Please enter both email and password', 'warning');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Logging in...';

          const response = await window.API.loginUser({ email, password });

          if (response.success && response.data && response.data.user) {
            window.Utils.showToast('Login successful! Welcome back.', 'success');
            
            // Redirect based on query param or role
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');

            setTimeout(() => {
              if (redirect) {
                window.location.href = decodeURIComponent(redirect);
              } else if (response.data.user.role === 'admin') {
                window.location.href = '/admin.html';
              } else {
                window.location.href = '/dashboard.html';
              }
            }, 800);
          }
        } catch (error) {
          window.Utils.showToast(error.message || 'Invalid email or password', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
        }
      });
    });
  </script>
</body>
</html>
