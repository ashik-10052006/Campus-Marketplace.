<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings | Campus Marketplace</title>
  <meta name="description" content="Manage, edit, or mark your active campus listings as sold.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/products.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container" style="padding-top: 2.5rem; padding-bottom: 5rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2.2rem; margin-bottom: 0.3rem;">My Marketplace Listings</h1>
        <p class="text-muted">Manage your active products, mark items sold, or edit details.</p>
      </div>
      <a href="/create-product.html" class="btn btn-sell">+ List Another Item</a>
    </div>

    <div class="card">
      <div id="my-listings-container">
        <div class="spinner-wrapper">
          <div class="spinner"></div>
          <span class="spinner-text">Loading your listings...</span>
        </div>
      </div>
    <!-- Confirmation Modal -->
    <div class="modal" id="confirm-modal" aria-hidden="true" role="dialog">
      <div class="modal-backdrop" id="confirm-modal-backdrop"></div>
      <div class="modal-content" style="max-width: 460px;">
        <div class="modal-header">
          <h3 class="modal-title" id="confirm-modal-title">Confirm Action</h3>
          <button type="button" class="modal-close" id="confirm-modal-close" aria-label="Close modal">&times;</button>
        </div>
        <div class="modal-body" style="padding: 1.25rem 0;">
          <div style="display: flex; gap: 1rem; align-items: flex-start;">
            <div id="confirm-modal-icon" style="font-size: 2rem; line-height: 1; flex-shrink: 0;">⚠️</div>
            <div>
              <p id="confirm-modal-text" style="color: var(--text-dark); font-size: 0.95rem; margin: 0; line-height: 1.5;">
                Are you sure you want to perform this action?
              </p>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 0.75rem;">
          <button type="button" class="btn btn-outline" id="confirm-modal-cancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="confirm-modal-proceed">Confirm</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container text-center">
      <p>&copy; 2026 Campus Marketplace for Students. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/my-listings.js"></script>
</body>
</html>
