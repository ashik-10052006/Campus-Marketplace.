<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories | Campus Marketplace Admin</title>
  <meta name="description" content="Manage marketplace categories, add new categories, and organize listings.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <span class="admin-sidebar-badge">Campus Admin</span>
        <div class="admin-sidebar-brand">
          <span style="font-size: 1.4rem;">🛡️</span>
          <h2>Management</h2>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="/admin.html" class="admin-nav-item">
          <span class="admin-nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="/admin-users.html" class="admin-nav-item">
          <span class="admin-nav-icon">👥</span>
          <span>Users</span>
        </a>
        <a href="/admin-products.html" class="admin-nav-item">
          <span class="admin-nav-icon">📦</span>
          <span>Products</span>
        </a>
        <a href="/admin-reports.html" class="admin-nav-item">
          <span class="admin-nav-icon">🚩</span>
          <span>Reports</span>
        </a>
        <a href="/admin-categories.html" class="admin-nav-item active">
          <span class="admin-nav-icon">🏷️</span>
          <span>Categories</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="/marketplace.html" class="admin-sidebar-link">
          <span>&larr;</span> Back to Marketplace
        </a>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <div class="admin-header-title">
          <h1>Marketplace Categories</h1>
          <p>Organize categories and tags available for students listing items on campus.</p>
        </div>

        <div class="admin-header-actions">
          <button type="button" class="btn btn-primary" id="open-category-modal-btn">
            <span>+</span> Add Category
          </button>
        </div>
      </div>

      <div class="admin-table-card">
        <div id="categories-table-container">
          <div class="spinner-wrapper" style="padding: 3.5rem 1rem;">
            <div class="spinner"></div>
            <span class="spinner-text">Loading categories...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Category Modal -->
  <div class="modal" id="category-modal">
    <div class="modal-backdrop" id="category-modal-backdrop"></div>
    <div class="modal-content" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="modal-title" id="category-modal-title">Add Category</h3>
        <button type="button" class="modal-close" id="close-category-modal-btn" aria-label="Close modal">&times;</button>
      </div>
      <form id="category-form">
        <div class="modal-body">
          <input type="hidden" id="category-id" />
          <div class="form-group">
            <label class="form-label" for="category-name-input">Category Name *</label>
            <input type="text" id="category-name-input" class="form-control" placeholder="e.g. Lab Equipment" required maxlength="50" />
          </div>

          <div class="form-group">
            <label class="form-label" for="category-desc-input">Description</label>
            <textarea id="category-desc-input" class="form-textarea" rows="3" placeholder="Brief description of items in this category..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancel-category-btn">Cancel</button>
          <button type="submit" id="save-cat-btn" class="btn btn-primary">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/admin-categories.js"></script>
</body>
</html>
