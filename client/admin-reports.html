<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Violation Reports | Campus Marketplace Admin</title>
  <meta name="description" content="Review student violation reports with Claude AI classification assistance.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <span class="admin-sidebar-badge">Campus Admin</span>
        <div class="admin-sidebar-brand">
          <span style="font-size: 1.4rem;">🛡️</span>
          <h2>Management</h2>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="/admin.html" class="admin-nav-item">
          <span class="admin-nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="/admin-users.html" class="admin-nav-item">
          <span class="admin-nav-icon">👥</span>
          <span>Users</span>
        </a>
        <a href="/admin-products.html" class="admin-nav-item">
          <span class="admin-nav-icon">📦</span>
          <span>Products</span>
        </a>
        <a href="/admin-reports.html" class="admin-nav-item active">
          <span class="admin-nav-icon">🚩</span>
          <span>Reports</span>
        </a>
        <a href="/admin-categories.html" class="admin-nav-item">
          <span class="admin-nav-icon">🏷️</span>
          <span>Categories</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="/marketplace.html" class="admin-sidebar-link">
          <span>&larr;</span> Back to Marketplace
        </a>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <div class="admin-header-title">
          <h1>Listing Violation Reports</h1>
          <p>Review student reports with Claude AI moderation intelligence and safety classifications.</p>
        </div>

        <div class="admin-header-actions">
          <select id="report-filter-status" class="form-select" style="min-width: 170px; font-size: 0.9rem; padding: 0.5rem 0.85rem;">
            <option value="">All Statuses</option>
            <option value="PENDING" selected>Pending Only</option>
            <option value="REVIEWED">Reviewed</option>
            <option value="RESOLVED">Resolved</option>
            <option value="REJECTED">Rejected</option>
          </select>
        </div>
      </div>

      <div id="reports-list-container">
        <div class="spinner-wrapper" style="padding: 3.5rem 1rem;">
          <div class="spinner"></div>
          <span class="spinner-text">Loading moderation reports...</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/admin-reports.js"></script>
</body>
</html>
