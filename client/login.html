<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Campus Marketplace</title>
  <meta name="description" content="Log in to your Campus Marketplace account to buy, sell, and message campus peers.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎓</div>
        <h1>Welcome Back</h1>
        <p>Log in with your student credentials to continue</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Campus Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@campus.edu" required autocomplete="email" />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          </div>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Show password" aria-controls="password" aria-pressed="false">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg mt-4">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Sign up for free</a>
      </div>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const eyeIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      const eyeOffIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isCurrentlyPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isCurrentlyPassword ? 'text' : 'password');
          toggleBtn.setAttribute('aria-label', isCurrentlyPassword ? 'Hide password' : 'Show password');
          toggleBtn.setAttribute('aria-pressed', isCurrentlyPassword ? 'true' : 'false');
          toggleBtn.innerHTML = isCurrentlyPassword ? eyeOffIconSvg : eyeIconSvg;
        });
      }

      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          window.Utils.showToast('Please enter both email and password', 'warning');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Logging in...';

          const response = await window.API.loginUser({ email, password });

          if (response.success && response.data && response.data.user) {
            window.Utils.showToast('Login successful! Welcome back.', 'success');
            
            // Redirect based on query param or role
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');

            setTimeout(() => {
              if (redirect) {
                const cleanRedirect = decodeURIComponent(redirect).trim();
                // Strictly allow only internal relative paths to prevent open redirect phishing
                if (cleanRedirect.startsWith('/') && !cleanRedirect.startsWith('//') && !cleanRedirect.includes('\\')) {
                  window.location.href = cleanRedirect;
                  return;
                }
              }

              if (response.data.user.role === 'admin') {
                window.location.href = '/admin';
              } else {
                window.location.href = '/dashboard';
              }
            }, 800);
          }
        } catch (error) {
          window.Utils.showToast(error.message || 'Invalid email or password', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
        }
      });
    });
  </script>
</body>
</html>
