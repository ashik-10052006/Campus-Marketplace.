<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories | Campus Marketplace Admin</title>
  <meta name="description" content="Manage marketplace categories, add new categories, and organize listings.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div style="margin-bottom: 2rem; padding: 0 0.5rem;">
        <span class="badge badge-admin" style="font-size: 0.8rem;">Campus Admin</span>
        <h2 style="font-size: 1.35rem; margin-top: 0.4rem;">Management</h2>
      </div>

      <nav class="admin-nav">
        <a href="/admin.html" class="admin-nav-item">📊 Dashboard</a>
        <a href="/admin-users.html" class="admin-nav-item">👥 Users</a>
        <a href="/admin-products.html" class="admin-nav-item">📦 Products</a>
        <a href="/admin-reports.html" class="admin-nav-item">🚩 Reports</a>
        <a href="/admin-categories.html" class="admin-nav-item active">🏷️ Categories</a>
      </nav>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <div>
          <h1 style="font-size: 2rem; margin-bottom: 0.3rem;">Marketplace Categories</h1>
          <p class="text-muted">Organize categories available for student listings.</p>
        </div>

        <button class="btn btn-primary" onclick="openCategoryModal()">+ Add Category</button>
      </div>

      <div class="card">
        <div id="categories-table-container">
          <div class="spinner-wrapper">
            <div class="spinner"></div>
            <span class="spinner-text">Loading categories...</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Category Modal -->
  <div class="modal" id="category-modal">
    <div class="modal-backdrop" onclick="window.Utils.closeModal('category-modal')"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="category-modal-title">Add Category</h3>
        <button class="modal-close" onclick="window.Utils.closeModal('category-modal')">&times;</button>
      </div>
      <form id="category-form">
        <div class="modal-body">
          <input type="hidden" id="category-id" />
          <div class="form-group">
            <label class="form-label" for="category-name-input">Category Name *</label>
            <input type="text" id="category-name-input" class="form-control" placeholder="e.g. Lab Equipment" required maxlength="50" />
          </div>

          <div class="form-group">
            <label class="form-label" for="category-desc-input">Description</label>
            <textarea id="category-desc-input" class="form-textarea" placeholder="Brief description of items in this category..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="window.Utils.closeModal('category-modal')">Cancel</button>
          <button type="submit" id="save-cat-btn" class="btn btn-primary">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/admin-categories.js"></script>
</body>
</html>
